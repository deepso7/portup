[package]
name = "portup"
version = "0.0.1"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
httparse = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
